# Pre-commit template for Python agent-readiness baseline.
# Copy to `.pre-commit-config.yaml` to activate, then run:
#   uvx pre-commit@4.7.0 install
#   uvx pre-commit@4.7.0 run --all-files
minimum_pre_commit_version: "4.0.0"

repos:
  # Generic repository hygiene (includes large file detection).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: end-of-file-fixer
        # The hook opens files for writing; the Claude Code sandbox blocks this for agent settings and skills.
        exclude: ^\.(claude|agents)/
      - id: trailing-whitespace
      - id: check-yaml
        # pnpm-lock.yaml contains several YAML documents.
        args: ["--allow-multiple-documents"]
      - id: check-toml

  # Python ecosystem checks, all executed through `uvx`.
  - repo: local
    hooks:
      # formatter -> ruff
      - id: ruff-format
        name: Ruff format
        entry: uvx ruff@0.17.1 format
        language: system
        types_or: [python, pyi]

      # lint_config + naming_consistency + cyclomatic_complexity + tech_debt_tracking -> ruff
      - id: ruff-check
        name: Ruff lint
        entry: uvx ruff@0.17.1 check --fix
        language: system
        types_or: [python, pyi]

      # type_check (+ strict typing where applicable) -> ty
      - id: ty-check
        name: Ty type check
        entry: uvx ty@0.0.89 check
        language: system
        pass_filenames: false

      # dead_code_detection -> vulture
      - id: vulture
        name: Vulture dead code
        entry: uvx vulture@2.16 . --min-confidence 80 --exclude .cache,.venv,node_modules
        language: system
        pass_filenames: false

      # duplicate_code_detection + file_size + function_size -> pylint checks
      - id: pylint-quality
        name: Pylint quality checks
        entry: uvx pylint@4.1.3 --disable=all --enable=duplicate-code,too-many-lines,too-many-statements --min-similarity-lines=8 --max-module-lines=500 --max-statements=50 --ignore=.cache,.venv,node_modules .
        language: system
        pass_filenames: false

      # unused_dependencies_detection -> deptry
      - id: deptry
        name: Deptry unused dependencies
        entry: uvx deptry@0.25.1 .
        language: system
        pass_filenames: false

      # secret scanner -> detect-secrets
      - id: detect-secrets
        name: Detect secrets
        entry: uvx --from detect-secrets@1.5.0 detect-secrets-hook
        language: system
        pass_filenames: true
